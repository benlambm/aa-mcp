[project]
name = "aa-mcp-server"
version = "0.1.0"
description = "MCP server wrapping the Artificial Analysis API for LLM and multimodal model data queries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jasen" },
]
keywords = ["mcp", "artificial-analysis", "llm", "ai", "benchmark", "model-comparison"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
aa-mcp-server = "aa_mcp.server:main"

[project.urls]
Homepage = "https://github.com/artificialanalysis/aa-mcp-server"
Repository = "https://github.com/artificialanalysis/aa-mcp-server"
Issues = "https://github.com/artificialanalysis/aa-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_mcp"]
