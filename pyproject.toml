[project]
name = "aa-mcp-server"
version = "0.1.0"
description = "MCP server wrapping the Artificial Analysis API for LLM and multimodal model data queries"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
aa-mcp-server = "aa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_mcp"]
